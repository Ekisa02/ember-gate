version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpass
      POSTGRES_DB: ember
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DB_DSN: "host=db user=pguser password=pgpass dbname=ember sslmode=disable"
      PORT: "8080"
      JWT_SECRET: "replace-this-with-a-secret"
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db-data:
